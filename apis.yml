aid: chucknorris-io
name: chucknorris.io
description: Free JSON REST API for hand-curated Chuck Norris jokes (facts) maintained by @matchilling.
  Supports random retrieval, category filtering, full-text search, and direct lookup by joke identifier.
  Hosted at api.chucknorris.io with an open-source Spring Boot service (chuck-api), official Node.js and
  Java client SDKs, a Chrome extension, a Storybook addon, and Messenger / Alexa companion apps published
  under the chucknorris-io GitHub organization.
